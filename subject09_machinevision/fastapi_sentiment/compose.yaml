# ============================================================
# ① Docker Compose 서비스 정의
# ============================================================
# services:
# Docker Compose가 관리할 컨테이너들을 정의하는 영역
#
# 현재 실습에서는 Redis 서비스 하나만 실행합니다.
# FastAPI와 Celery Worker는 별도 터미널에서 실행합니다.

services:

  # ==========================================================
  # ② Redis 서비스 이름 지정
  # ==========================================================
  # redis : Docker Compose에서 사용하는 서비스 이름
  #
  # 이후 docker compose 명령으로
  # redis 서비스를 선택하여 관리할 수 있습니다.

  redis:

    # --------------------------------------------------------
    # ③ Redis Docker 이미지 지정
    # --------------------------------------------------------
    # image : 컨테이너를 생성할 때 사용할 이미지
    #
    # redis:7-alpine
    # : Redis 7 버전의 Alpine Linux 기반 이미지
    #
    # 이미지가 로컬에 없으면 Docker가 다운로드합니다.
    # 별도의 Dockerfile을 작성할 필요는 없습니다.

    image: redis:7-alpine


    # --------------------------------------------------------
    # ④ Redis 컨테이너 이름 지정
    # --------------------------------------------------------
    # container_name :
    # 실제 생성되는 컨테이너의 이름을 지정합니다.
    #
    # 예: docker logs sentiment-redis

    container_name: sentiment-redis


    # --------------------------------------------------------
    # ⑤ 컨테이너 재시작 정책 설정
    # --------------------------------------------------------
    # restart: unless-stopped
    #
    # Redis 컨테이너가 종료되면
    # Docker가 자동 재시작하도록 설정합니다.
    #
    # 단, 사용자가 명시적으로 중지한 경우에는
    # 자동으로 다시 시작하지 않습니다.

    restart: unless-stopped


    # --------------------------------------------------------
    # ⑥ 포트 연결 설정
    # --------------------------------------------------------
    # ports : 로컬 PC와 컨테이너의 포트를 연결
    #
    # 127.0.0.1 : 로컬 호스트에서만 접근 허용
    # 6380      : 로컬 PC에서 사용하는 포트
    # 6379      : Redis 컨테이너 내부 포트
    #
    # FastAPI와 Celery가 접속할 Redis 주소는 .env의
    # REDIS_CACHE_URL / CELERY_BROKER_URL / CELERY_RESULT_BACKEND에 둡니다.

    ports:
      - "127.0.0.1:6380:6379"


    # --------------------------------------------------------
    # ⑦ Redis 데이터 저장 공간 연결
    # --------------------------------------------------------
    # volumes :
    # Docker 볼륨을 컨테이너 내부 폴더와 연결합니다.
    #
    # redis_data : Docker가 관리하는 볼륨 이름
    # /data      : Redis 컨테이너 내부 저장 경로
    #
    # 컨테이너를 삭제하고 다시 생성해도
    # 볼륨이 남아 있으면 저장 데이터를 유지할 수 있습니다.

    volumes:
      - redis_data:/data


    # --------------------------------------------------------
    # ⑧ Redis 서버 실행 명령 설정
    # --------------------------------------------------------
    # command : 컨테이너 시작 시 실행할 명령
    #
    # redis-server :
    # Redis 서버 실행
    #
    # --appendonly yes :
    # AOF(Append Only File) 영속성 기능 활성화
    #
    # Redis의 데이터 변경 내용을 파일에 기록하여
    # 재시작 후 데이터를 복구할 수 있도록 합니다.

    command: ["redis-server", "--appendonly", "yes"]


    # --------------------------------------------------------
    # ⑨ Redis 서버 정상 동작 검사 설정
    # --------------------------------------------------------
    # healthcheck :
    # 컨테이너 내부 서비스의 정상 동작 여부를 검사
    #
    # redis-cli ping :
    # Redis 서버에 PING 명령을 보내 상태 확인
    #
    # 정상 응답 : PONG

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]


      # ------------------------------------------------------
      # ⑩ 상태 검사 주기 및 실패 기준 설정
      # ------------------------------------------------------
      # interval: 5s
      # : 5초 간격으로 상태 검사
      #
      # timeout: 3s
      # : 검사 명령이 3초 안에 끝나지 않으면 실패
      #
      # retries: 10
      # : 연속 10회 실패하면 unhealthy 상태로 판단
      #
      # 주의:
      # unhealthy 상태가 되었다고 해서
      # Redis를 자동 재시작하는 설정은 아닙니다.

      interval: 5s
      timeout: 3s
      retries: 10


  # ==========================================================
  # ⑫ PostgreSQL 서비스 (06-20 최종 확장 실습에서 추가)
  # ==========================================================
  # 감정분석 문장·결과·상태를 영구 저장하는 DB 서버
  # 5433 : 로컬 PC 포트 (기본 5432를 쓰는 다른 PostgreSQL과 충돌 방지)
  # 5432 : 컨테이너 내부 포트

  postgres:
    image: postgres:17-alpine
    container_name: sentiment-postgres
    restart: unless-stopped
    environment:
      # 계정·비밀번호는 .env에서 읽음 (docker compose가 같은 폴더의 .env를 자동으로 읽는다)
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB 필요}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10


# ============================================================
# ⑪ Docker 볼륨 생성 및 관리 설정
# ============================================================
# services 내부의 volumes와는 역할이 다릅니다.
#
# 위의 redis_data:/data
# : Redis 컨테이너가 사용할 볼륨 연결
#
# 아래의 redis_data:
# : Docker Compose에서 해당 이름의 볼륨을 정의
#
# 저장된 데이터는 일반적인 컨테이너 재생성 시에도
# 볼륨이 유지되는 동안 보존될 수 있습니다.

volumes:
  redis_data:
  postgres_data:
