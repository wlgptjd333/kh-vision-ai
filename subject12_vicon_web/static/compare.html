<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>따라하기 비교</title>
  <style>
    :root { --bg: #202530; --panel: #2a303d; --line: #3a4252; --text: #e8ebf0; --muted: #9aa3b2; --ok: #4cc38a; --warn: #e8b84a; --bad: #ef6b6b; --accent: #5b9cff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", Arial, sans-serif; }
    #toolbar { padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    select, button { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    label { font-size: 14px; color: var(--muted); }
    #status { color: var(--muted); font-size: 14px; }
    a { color: var(--accent); }
    .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
    .panel { background: #1a1f28; border: 1px solid var(--line); border-radius: 8px; position: relative; overflow: hidden; aspect-ratio: 4 / 3; }
    .panel .tag { position: absolute; top: 8px; left: 10px; font-size: 13px; color: var(--muted); z-index: 2; background: #000a; padding: 2px 8px; border-radius: 4px; }
    #viewer { width: 100%; height: 100%; }
    #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    #countdown { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 120px; font-weight: bold; color: #fff; text-shadow: 0 0 20px #000; z-index: 3; }
    .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 12px; }
    .card { background: var(--panel); border-radius: 8px; padding: 12px; font-size: 14px; }
    .card h3 { margin: 0 0 8px; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: normal; border-bottom: 1px solid var(--line); }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    #score { font-size: 40px; font-weight: bold; }
    .bar { height: 8px; background: #1a1f28; border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; }
    ul { margin: 8px 0 0; padding-left: 20px; }
    @media (max-width: 760px) { .stage, .bottom { grid-template-columns: 1fr; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    <a href="/">← 1일차</a>
    <strong>따라하기 비교 (2일차)</strong>
    <select id="action"></select>
    <button id="camera">카메라 켜기</button>
    <button id="record" class="primary" disabled>따라하기 녹화</button>
    <label><input type="checkbox" id="mirror"> 좌우 반전 비교</label>
    <span id="status">준비 중...</span>
  </div>

  <div class="stage">
    <div class="panel"><span class="tag">VICON 기준 동작</span><div id="viewer"></div></div>
    <div class="panel">
      <span class="tag" id="camTag">웹캠 (YOLO Pose)</span>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="countdown"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="card">
      <h3>실시간 관절각도</h3>
      <table>
        <thead><tr><th>관절</th><th>기준</th><th>나</th><th>차이</th></tr></thead>
        <tbody id="live"></tbody>
      </table>
    </div>
    <div class="card" id="resultCard">
      <h3>녹화 결과</h3>
      <div id="result" style="color:var(--muted)">카메라를 켜고 「따라하기 녹화」를 누르면, 3초 뒤 기준 동작이 처음부터 재생됩니다. 끝날 때까지 따라 하세요.</div>
    </div>
  </div>

  <script type="module">
    import { createViewer } from "/static/viewer.js";

    const $ = id => document.getElementById(id);
    const status = $("status");
    const viewer = createViewer($("viewer"));
    const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
    const grab = document.createElement("canvas");

    const ANGLES = ["left_elbow", "right_elbow", "left_shoulder", "right_shoulder", "left_hip", "right_hip", "left_knee", "right_knee"];
    const KO = { left_elbow: "왼쪽 팔꿈치", right_elbow: "오른쪽 팔꿈치", left_shoulder: "왼쪽 어깨", right_shoulder: "오른쪽 어깨", left_hip: "왼쪽 고관절", right_hip: "오른쪽 고관절", left_knee: "왼쪽 무릎", right_knee: "오른쪽 무릎" };
    // COCO 17 뼈대 연결선
    const EDGES = [[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];

    let reference = null;     // /api/reference-angles 결과
    let lastAngles = {};      // 웹캠 최신 각도
    let cameraOn = false;
    let recording = null;     // { start, frames: [] }

    $("live").innerHTML = ANGLES.map(k => `<tr><td>${KO[k]}</td><td id="r_${k}">-</td><td id="u_${k}">-</td><td id="d_${k}">-</td></tr>`).join("");

    const mirror = a => Object.fromEntries(Object.entries(a).map(([k, v]) =>
      [k.startsWith("left_") ? k.replace("left_", "right_") : k.replace("right_", "left_"), v]));
    const cls = d => d == null ? "" : d < 15 ? "ok" : d < 30 ? "warn" : "bad";

    // ----------------------------------
    // 1. 동작 선택 → GLB 재생 + 기준 각도 불러오기
    // ----------------------------------
    async function selectAction(name) {
      $("record").disabled = true;
      reference = null;
      status.textContent = `${name} 로딩 중...`;
      try {
        const info = await viewer.load(name);
        const res = await fetch(`/api/reference-angles/${name}`);
        if (!res.ok) throw new Error((await res.json()).detail);
        reference = await res.json();
        status.textContent = `${info.duration.toFixed(1)}초 동작 | 기준 각도 ${reference.times.length}프레임`;
      } catch (e) {
        status.textContent = "오류: " + e.message;
      }
      $("record").disabled = !(reference && cameraOn);
    }

    // 기준 동작이 재생되는 시간에 맞는 기준 각도
    function refAnglesAt(t) {
      if (!reference) return {};
      const i = Math.min(reference.times.length - 1, Math.max(0, Math.round(t * reference.fps)));
      return Object.fromEntries(ANGLES.map(k => [k, reference.angles[k][i]]));
    }

    viewer.onTick(t => {
      const ref = refAnglesAt(t);
      const me = $("mirror").checked ? mirror(lastAngles) : lastAngles;
      for (const k of ANGLES) {
        const r = ref[k], u = me[k];
        const d = r != null && u != null ? Math.abs(r - u) : null;
        $(`r_${k}`).textContent = r == null ? "-" : r.toFixed(0) + "°";
        $(`u_${k}`).textContent = u == null ? "-" : u.toFixed(0) + "°";
        const cell = $(`d_${k}`);
        cell.textContent = d == null ? "-" : d.toFixed(0) + "°";
        cell.className = cls(d);
      }
    });

    // ----------------------------------
    // 2. 웹캠 → FastAPI /api/pose (한 장씩 보내고, 답이 오면 다음 장)
    // ----------------------------------
    $("camera").onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
        video.srcObject = stream;
        await video.play();
        cameraOn = true;
        $("camera").disabled = true;
        $("record").disabled = !reference;
        poseLoop();
      } catch (e) {
        status.textContent = "카메라 오류: " + e.message + " (Chrome 주소창의 카메라 권한을 확인하세요)";
      }
    };

    async function poseLoop() {
      while (cameraOn) {
        const w = video.videoWidth, h = video.videoHeight;
        if (!w) { await new Promise(r => setTimeout(r, 100)); continue; }
        grab.width = w; grab.height = h;
        grab.getContext("2d").drawImage(video, 0, 0, w, h);
        const blob = await new Promise(r => grab.toBlob(r, "image/jpeg", 0.7));
        const t = performance.now();
        try {
          const res = await fetch("/api/pose", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail);
          lastAngles = data.angles || {};
          draw(data);
          $("camTag").textContent = data.found ? `웹캠 (YOLO Pose) · ${data.infer_ms}ms` : "웹캠 · 사람이 안 보입니다";
          if (recording) recording.frames.push({ t: (t - recording.start) / 1000, angles: lastAngles });
        } catch (e) {
          $("camTag").textContent = "Pose 오류: " + e.message;
          await new Promise(r => setTimeout(r, 1000));
        }
      }
    }

    function draw(data) {
      overlay.width = data.width; overlay.height = data.height;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      if (!data.found) return;
      const kp = data.keypoints;
      ctx.lineWidth = 4; ctx.strokeStyle = "#5b9cff";
      for (const [a, b] of EDGES) {
        if (kp[a][2] < 0.5 || kp[b][2] < 0.5) continue;
        ctx.beginPath(); ctx.moveTo(kp[a][0], kp[a][1]); ctx.lineTo(kp[b][0], kp[b][1]); ctx.stroke();
      }
      ctx.fillStyle = "#4cc38a";
      for (const [x, y, c] of kp) if (c >= 0.5) { ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); }
    }

    // ----------------------------------
    // 3. 따라하기 녹화: 3초 카운트다운 → 기준 동작 처음부터 → 끝나면 비교
    // ----------------------------------
    $("record").onclick = async () => {
      const name = $("action").value;
      $("record").disabled = $("action").disabled = true;
      viewer.setPlaying(false); viewer.restart();
      const cd = $("countdown");
      cd.style.display = "flex";
      for (const n of [3, 2, 1]) { cd.textContent = n; await new Promise(r => setTimeout(r, 1000)); }
      cd.style.display = "none";

      viewer.restart(); viewer.setPlaying(true);
      recording = { start: performance.now(), frames: [] };
      const ms = viewer.duration * 1000;
      while (performance.now() - recording.start < ms) {
        status.textContent = `녹화 중... ${((performance.now() - recording.start) / 1000).toFixed(1)} / ${viewer.duration.toFixed(1)}초 · ${recording.frames.length}프레임`;
        await new Promise(r => setTimeout(r, 200));
      }
      const frames = recording.frames;
      recording = null;
      status.textContent = `비교 중... (${frames.length}프레임)`;

      try {
        const res = await fetch("/api/compare", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: name, mirror: $("mirror").checked, frames }),
        });
        const r = await res.json();
        if (!res.ok) throw new Error(r.detail);
        showResult(r);
        status.textContent = `비교 완료 · 저장: ${r.saved}`;
      } catch (e) {
        status.textContent = "비교 오류: " + e.message;
      }
      $("record").disabled = $("action").disabled = false;
    };

    function showResult(r) {
      const color = r.grade === "OK" ? "ok" : r.grade === "보통" ? "warn" : "bad";
      const rows = Object.entries(r.per_angle).filter(([, v]) => v).map(([k, v]) => `
        <tr><td>${v.name_ko}</td><td>${v.ref_mean}°</td><td>${v.user_mean}°</td>
        <td class="${cls(v.mean_diff)}">${v.mean_diff}°</td>
        <td style="width:30%"><div class="bar"><div style="width:${Math.min(100, v.mean_diff / 30 * 100)}%;background:var(--${cls(v.mean_diff) || "muted"})"></div></div></td></tr>`).join("");
      $("result").innerHTML = `
        <div><span id="score" class="${color}">${r.score}</span> 점 · <b class="${color}">${r.grade}</b>
          <span style="color:var(--muted)"> · 평균 각도 차이 ${r.mean_diff_deg}° · 사람 인식 ${Math.round(r.detected_ratio * 100)}% · ${r.user_frames}프레임</span></div>
        <ul>${r.feedback.map(f => `<li>${f}</li>`).join("")}</ul>
        <table style="margin-top:8px"><thead><tr><th>관절</th><th>기준 평균</th><th>나 평균</th><th>차이</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    // ----------------------------------
    // 4. 시작: JSON이 추출된 동작만 목록에 표시
    // ----------------------------------
    const actions = (await (await fetch("/api/actions")).json()).filter(a => a.has_json);
    if (!actions.length) {
      status.innerHTML = '추출된 JSON이 없습니다. <a href="/">1일차 화면</a>에서 「전체 추출」을 먼저 하세요.';
    } else {
      $("action").innerHTML = actions.map(a => `<option value="${a.name}">${a.name}</option>`).join("");
      $("action").onchange = e => selectAction(e.target.value);
      selectAction(actions[0].name);
    }
  </script>
</body>
</html>
