<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VICON 동작 뷰어</title>
  <style>
    :root { --bg: #202530; --panel: #2a303d; --line: #3a4252; --text: #e8ebf0; --muted: #9aa3b2; --ok: #4cc38a; --accent: #5b9cff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", Arial, sans-serif; }
    #toolbar { padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    #toolbar strong { margin-right: 6px; }
    select, button { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    #status { color: var(--muted); font-size: 14px; }
    a { color: var(--accent); }
    main { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 58px); }
    #viewer { min-height: 360px; }
    aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 10px; font-size: 13px; }
    aside h3 { margin: 4px 0 8px; font-size: 14px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .row:hover, .row.active { background: var(--panel); }
    .done { color: var(--ok); }
    .todo { color: var(--muted); }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #viewer { height: 60vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    <strong>VICON 동작 재생 (1일차)</strong>
    <select id="action"></select>
    <button id="play">일시정지</button>
    <button id="extract" class="primary" disabled>3D JSON 추출</button>
    <button id="extractAll" disabled>전체 추출</button>
    <span id="status">동작 목록 불러오는 중...</span>
    <a href="/compare" style="margin-left:auto">2일차 따라하기 비교 →</a>
  </div>

  <main>
    <div id="viewer"></div>
    <aside>
      <h3>동작 목록 <span id="count" class="todo"></span></h3>
      <div id="list"></div>
    </aside>
  </main>

  <script type="module">
    import { createViewer } from "/static/viewer.js";

    const $ = id => document.getElementById(id);
    const status = $("status");
    const viewer = createViewer($("viewer"));
    let actions = [];
    let busy = false;

    // ----------------------------------
    // 1. 동작 목록 (서버 /api/actions)
    // ----------------------------------
    async function refreshList() {
      actions = await (await fetch("/api/actions")).json();
      const current = $("action").value;
      $("action").innerHTML = actions.map(a => `<option value="${a.name}">${a.name}</option>`).join("");
      if (current) $("action").value = current;
      const done = actions.filter(a => a.has_json).length;
      $("count").textContent = `JSON ${done}/${actions.length}`;
      $("list").innerHTML = actions.map(a => `
        <div class="row ${a.name === $("action").value ? "active" : ""}" data-name="${a.name}">
          <span>${a.name.replace("_LHY", "")}</span>
          <span class="${a.has_json ? "done" : "todo"}">${a.has_json ? "JSON ✓" : "미추출"}</span>
        </div>`).join("");
      $("list").querySelectorAll(".row").forEach(r => r.onclick = () => selectAction(r.dataset.name));
    }

    // ----------------------------------
    // 2. GLB 불러오기 + 재생
    // ----------------------------------
    async function selectAction(name) {
      if (busy) return;
      $("action").value = name;
      $("extract").disabled = true;
      status.textContent = `${name} 로딩 중...`;
      try {
        const info = await viewer.load(name);
        viewer.setPlaying(true);
        $("play").textContent = "일시정지";
        status.textContent = `재생 중 | ${info.duration.toFixed(2)}초 | Bone ${info.boneCount}개`;
        $("extract").disabled = false;
        $("extractAll").disabled = false;
      } catch (e) {
        console.error(e);
        status.textContent = "오류: " + e.message;
      }
      refreshList();
    }

    // ----------------------------------
    // 3. JSON 추출 → FastAPI 저장
    // ----------------------------------
    async function saveToServer(data) {
      const res = await fetch("/api/save-json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error((await res.json()).detail || `HTTP ${res.status}`);
      return res.json();
    }

    function download(data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = Object.assign(document.createElement("a"), { href: url, download: data.source_glb.replace(".glb", "_3d.json") });
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    $("extract").onclick = async () => {
      busy = true; $("extract").disabled = true;
      status.textContent = "3D JSON 추출 중...";
      try {
        const data = viewer.extract(30);
        let saved = "서버 저장 실패";
        try { const r = await saveToServer(data); saved = `서버 저장: ${r.path}`; } catch (e) { console.error(e); }
        download(data);
        status.textContent = `${data.frame_count}프레임 / Bone ${data.bone_count}개 | ${saved} + 다운로드`;
      } catch (e) {
        status.textContent = "추출 오류: " + e.message;
      } finally {
        busy = false; $("extract").disabled = false; refreshList();
      }
    };

    // 17개를 차례로 불러와 서버에만 저장 (다운로드는 생략)
    $("extractAll").onclick = async () => {
      busy = true;
      $("extract").disabled = $("extractAll").disabled = true;
      let ok = 0;
      for (const [i, a] of actions.entries()) {
        status.textContent = `전체 추출 ${i + 1}/${actions.length}: ${a.name}`;
        try {
          await viewer.load(a.name);
          await saveToServer(viewer.extract(30));
          ok++;
        } catch (e) { console.error(a.name, e); }
      }
      busy = false;
      status.textContent = `전체 추출 완료: ${ok}/${actions.length}개 저장 (output/json/)`;
      $("extract").disabled = $("extractAll").disabled = false;
      await refreshList();
      selectAction($("action").value);
    };

    $("play").onclick = () => {
      viewer.setPlaying(!viewer.playing);
      $("play").textContent = viewer.playing ? "일시정지" : "재생";
    };
    $("action").onchange = e => selectAction(e.target.value);

    await refreshList();
    if (actions.length) selectAction(actions[0].name);
    else status.textContent = "assets/ 폴더에 GLB가 없습니다.";
  </script>
</body>
</html>
